<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technology Coding Course</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
            --text-color: #333;
            --sidebar-width: 280px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--light-bg);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-color);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #1a252f;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #34495e;
        }

        .sidebar-menu {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .sidebar-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-item:hover {
            background-color: var(--secondary-color);
        }

        .sidebar-item.active {
            background-color: var(--accent-color);
            font-weight: bold;
        }

        .badge {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        /* Main Content Styling */
        #main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        ul, ol {
            margin-left: 25px;
            margin-bottom: 20px;
        }

        li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        /* Code Block Styling */
        pre {
            background-color: #272822;
            color: #f8f8f2;
            padding: 15px 20px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: auto;
            margin: 20px 0;
            line-height: 1.4;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            background-color: #eef2f5;
            padding: 2px 6px;
            border-radius: 4px;
            color: #c7254e;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            color: inherit;
        }

        /* Quiz Box Styling */
        .quiz-section {
            margin-top: 40px;
            border-top: 2px solid #eee;
            padding-top: 30px;
        }

        .quiz-card {
            background-color: var(--light-bg);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-label:hover {
            background: #edf7ff;
        }

        /* Contact Form Styling */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: bold;
            color: var(--secondary-color);
        }

        .form-group input, .form-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Buttons Navigation */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-secondary { background-color: #95a5a6; color: white; }
        .btn-success { background-color: var(--success-color); color: white; }

        /* Custom Tkinter Modal Simulator */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .tkinter-window {
            background: #f0f0f0;
            border: 2px solid #777;
            border-radius: 3px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-family: sans-serif;
        }

        .tkinter-titlebar {
            background: linear-gradient(to bottom, #4a90e2, #2176ff);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .tkinter-body {
            padding: 20px;
            text-align: center;
            background: #f0f0f0;
        }

        .tkinter-btn {
            background: #e1e1e1;
            border: 1px solid #adadad;
            color: black;
            padding: 5px 20px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: inset 0 1px 0 white;
        }

        .tkinter-btn:active {
            background: #c1c1c1;
        }

        /* Grading and Feedback elements */
        .feedback-message {
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .correct { background-color: #d4edda; color: #155724; }
        .incorrect { background-color: #f8d7da; color: #721c24; }
    </style>
</head>

                    <h2>Lesson 4: How Variables Work in a Program</h2>
                    <p>Now that we have learned what a variable is, let’s take the next step and learn how variables work when we use them in coding. Remember, a variable is like a box with a label that stores information. But how do we actually use this box in a program?</p>
                    <p>First, let’s think about how we use labels in real life. Imagine you have three boxes:</p>
                    <ul>

                        <li>One labeled <strong>Art Supplies</strong></li>

                    <p>Now, inside each box, the objects can be changed. You might have cookies in the snack box today and chips tomorrow. The box remains the same, but the contents change. This is exactly what happens with variables. The value inside the variable can be changed anytime we need.</p>

                    <ul>
                        <li>Names, Words, Colors</li>
                        <li>Yes-or-no answers, Messages</li>

        // Initializes the sidebar items dynamically
        function buildSidebar() {
            const menu = document.getElementById('menu-list');
            menu.innerHTML = '';
            courseData.forEach((mod, idx) => {
                const li = document.createElement('li');
                li.className = `sidebar-item ${idx === currentModuleIndex ? 'active' : ''}`;
                li.onclick = () => switchModule(idx);
                
                let badgeText = 'Read';
                if (mod.type === 'lesson_quiz') badgeText = 'Quiz';
                if (mod.type === 'final_project') badgeText = 'Final';
                if (mod.type === 'contact_page') badgeText = 'Info';
                
                li.innerHTML = `<span>${mod.title}</span> <span class="badge">${badgeText}</span>`;
                menu.appendChild(li);
            });
        }

        // Swaps modules when a menu option is selected
        function switchModule(index) {
            currentModuleIndex = index;
            buildSidebar();
            renderContent();
        }

        // Renders content and quizzes to the workspace screen area
        function renderContent() {
            const pane = document.getElementById('content-pane');
            const mod = courseData[currentModuleIndex];
            
            let htmlContent = `<div>${mod.html}</div>`;

            if (mod.type === 'lesson_quiz' && mod.questions) {
                htmlContent += `<div class="quiz-section"><h3>Module Review Quiz</h3>`;
                mod.questions.forEach((q, qIdx) => {
                    htmlContent += `
                        <div class="quiz-card" id="q-card-${qIdx}">
                            <p class="question-text">${qIdx + 1}. ${q.q}</p>
                            <div class="options-group">
                    `;
                    q.a.forEach((opt, oIdx) => {
                        let letterCode = String.fromCharCode(65 + oIdx); 
                        let displayValue = q.a.length === 2 ? opt : `${letterCode}) ${opt}`;
                        let valueAttribute = q.a.length === 2 ? opt : letterCode;

                        htmlContent += `
                            <label class="option-label">
                                <input type="radio" name="mod-q-${qIdx}" value="${valueAttribute}" onclick="gradeQuestion(${qIdx}, '${valueAttribute}')">
                                ${displayValue}
                            </label>
                        `;
                    });
                    htmlContent += `
                            </div>
                            <div class="feedback-message" id="feedback-${qIdx}"></div>
                        </div>
                    `;
                });
                htmlContent += `</div>`;
            }

            // Controls navigation button layouts footer
            htmlContent += `
                <div class="nav-buttons">
                    <button class="btn-secondary" onclick="movePrev()" ${currentModuleIndex === 0 ? 'style="visibility:hidden;"' : ''}>Previous</button>
                    <button class="btn-primary" onclick="moveNext()" ${currentModuleIndex === courseData.length - 1 ? 'style="visibility:hidden;"' : ''}>Next Lesson</button>
                </div>
            `;

            pane.innerHTML = htmlContent;
            pane.scrollTop = 0;
        }

        // Automated multi-choice scoring feedback engine
        window.gradeQuestion = function(qIdx, selectedValue) {
            const mod = courseData[currentModuleIndex];
            const question = mod.questions[qIdx];
            const feedbackBox = document.getElementById(`feedback-${qIdx}`);
            const card = document.getElementById(`q-card-${qIdx}`);

            feedbackBox.style.display = "block";
            if (selectedValue === question.c) {
                feedbackBox.textContent = "✓ Correct Answer!";
                feedbackBox.className = "feedback-message correct";
                card.style.borderLeft = "4px solid var(--success-color)";
            } else {
                feedbackBox.textContent = `✗ Incorrect. Target key option code requires: ${question.c}`;
                feedbackBox.className = "feedback-message incorrect";
                card.style.borderLeft = "4px solid var(--danger-color)";
            }
        }

        // Handle contact form mock submission
        window.handleContactSubmit = function(event) {
            event.preventDefault();
            const successBox = document.getElementById('contact-success');
            successBox.style.display = 'block';
            event.target.reset(); 
        }

        window.movePrev = function() {
            if (currentModuleIndex > 0) switchModule(currentModuleIndex - 1);
        }

        window.moveNext = function() {
            if (currentModuleIndex < courseData.length - 1) switchModule(currentModuleIndex + 1);
        }

        // Simulated Tkinter Desktop App Window Launcher Logic Actions
        window.triggerTkinterPopup = function() {
            document.getElementById('popup-overlay').classList.add('show');
        }

        window.closePopup = function() {
            document.getElementById('popup-overlay').classList.remove('show');
